[project]
name = "story-arena"
version = "0.2.0"
description = "Collaborative story writing by a room of LLM-powered writers"
authors = [{ name = "Justin Weisz", email = "jweisz@us.ibm.com" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "litellm>=1.106",
    "pydantic>=2.12",
    "python-dotenv>=1.0",
    "rich>=14.0",
]

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
