# Model aliases for Story Arena.
#
# Use an alias anywhere a model is expected: in the first line of a writer
# file (`# claude`), or with `--model` / `--model-override`. You can also skip
# aliases and pass any LiteLLM model string directly, e.g.
# `--model anthropic/claude-opus-5-5`.
#
# Keys per alias:
#   model        (required) LiteLLM model string: "<provider>/<model>"
#   api_base     (optional) endpoint URL, for local or self-hosted servers
#   api_key_env  (optional) name of the env var that holds the API key
#   temperature  (optional) for this model; --temperature overrides it. If
#                neither is set, the model's own default temperature is used.
#   any other key is passed straight through to litellm.acompletion()
#
# API keys never go in this file. Put them in .env (see .env.sample).
# Providers: https://docs.litellm.ai/docs/providers

# Ollama (https://ollama.com): `ollama pull granite4.2:3b`
[models.local]
model = "ollama_chat/granite4.2:3b"
# no api_base, so OLLAMA_API_BASE applies (default http://localhost:11434)
# granite4.2 is a thinking model; turning thinking off makes it about 10x faster
reasoning_effort = "none"
# small models occasionally get stuck repeating themselves; cap the response
# length so a runaway generation fails fast and is retried. Ideation responses
# need ~1-2k tokens, and at ~30 tokens/s this cap stays under the 120s timeout.
max_tokens = 3072

# LM Studio (https://lmstudio.ai): start the local server, then set `model`
# to the identifier LM Studio shows for the model you have loaded
[models.lmstudio]
model = "lm_studio/qwen/qwen3-8b"
api_base = "http://localhost:1234/v1"

# Anthropic: needs ANTHROPIC_API_KEY
[models.claude]
model = "anthropic/claude-sonnet-5-5"

[models.claude-opus]
model = "anthropic/claude-opus-5-5"

[models.claude-haiku]
model = "anthropic/claude-haiku-5-5"

# OpenAI: needs OPENAI_API_KEY
[models.gpt]
model = "openai/gpt-5.6"

[models.gpt-mini]
model = "openai/gpt-5.4-mini"
